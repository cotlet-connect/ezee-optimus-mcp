[project]
name = "ezee-optimus-mcp"
version = "1.1.0"
description = "Connect eZee Optimus to ChatGPT, Claude, Codex and Claude Code through Cotlet.dev, a hosted MCP server. No eZee Optimus API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["ezee-optimus", "ezee-optimus api", "ezee-optimus mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/ezee-optimus-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=ezee-optimus"
Source = "https://github.com/cotlet-connect/ezee-optimus-mcp"

[project.scripts]
ezee-optimus-mcp = "ezee_optimus_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"ezee_optimus_agent.py" = "ezee_optimus_agent.py"

[tool.hatch.build.targets.sdist]
include = ["ezee_optimus_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
